name: Import real Texas plans from the CMS PUFs

# Phase B. The environment this project was developed in cannot reach cms.gov
# (the egress proxy answers 403), so the Public Use Files are downloaded here,
# on a GitHub runner, instead. This opens a pull request with the generated
# JSON rather than committing to a branch directly, so the plans get reviewed.
#
# Run it from the Actions tab. If the download URLs have moved, the job fails
# with the exact files to fetch by hand and where to put them; re-run with
# `puf_base_url` pointing at a mirror, or commit the CSVs under
# data/cms-puf/py2026/ on a branch and run the importer locally.

on:
  workflow_dispatch:
    inputs:
      puf_base_url:
        description: 'Base URL for the plan-year 2026 Exchange PUF zip files'
        required: false
        default: 'https://download.cms.gov/marketplace-puf/2026'
      plan_year:
        description: 'Plan year'
        required: false
        default: '2026'

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Download the Exchange Public Use Files
        id: download
        env:
          BASE: ${{ inputs.puf_base_url }}
        run: |
          set -uo pipefail
          mkdir -p data/cms-puf/py2026
          cd data/cms-puf/py2026

          # The files the importer needs, plus the data dictionary so the
          # column names can be checked against the source of truth.
          FILES="
          plan-attributes-puf.zip
          rate-puf.zip
          benefits-and-cost-sharing-puf.zip
          service-area-puf.zip
          network-puf.zip
          "
          DICTS="
          plan-attributes-data-dictionary.pdf
          rate-data-dictionary.pdf
          benefits-and-cost-sharing-data-dictionary.pdf
          service-area-data-dictionary.pdf
          network-data-dictionary.pdf
          "

          missing=""
          for f in $FILES; do
            echo "::group::GET $BASE/$f"
            if curl -fsSL --retry 3 --retry-delay 5 -o "$f" "$BASE/$f"; then
              echo "ok  $(du -h "$f" | cut -f1)  $f"
            else
              echo "FAILED  $f"
              missing="$missing $f"
            fi
            echo "::endgroup::"
          done

          # Data dictionaries are best-effort: useful for review, not required.
          for f in $DICTS; do
            curl -fsSL --retry 2 -o "$f" "$BASE/$f" 2>/dev/null \
              && echo "ok (dictionary)  $f" || echo "no dictionary at $BASE/$f"
          done

          if [ -n "$missing" ]; then
            echo
            echo "Could not download:$missing"
            echo
            echo "The CMS PUF download URLs have probably moved. Find them at"
            echo "  https://www.cms.gov/marketplace/resources/data/public-use-files"
            echo "and either re-run this workflow with puf_base_url set, or download"
            echo "the CSVs by hand into data/cms-puf/py2026/ and run:"
            echo "  npm run import:plans -- --dir data/cms-puf/py2026"
            exit 1
          fi

          for z in *.zip; do unzip -o -q "$z" && rm "$z"; done
          echo "Extracted:"
          ls -la

      - name: Import Harris County plans
        run: npm run import:plans -- --dir data/cms-puf/py2026 --out data/plans/harris-2026.json

      - name: Check every plan document link
        run: npm run check:links

      - name: Typecheck and test against the imported data
        run: |
          npm run typecheck
          npm test

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="plans/harris-county-${{ inputs.plan_year }}-$(date +%Y%m%d%H%M)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Only the derived files: the raw PUFs are gitignored.
          git add data/plans/harris-2026.json data/plans/harris-2026.provenance.json
          git commit -m "data: import Harris County ${{ inputs.plan_year }} plans from the CMS PUFs

          Generated by .github/workflows/import-plans.yml. Every plan term,
          premium and document URL is copied from a PUF row. The provenance
          file records the source files, their checksums and row counts.

          Networks and formularies remain simulated: the PUFs carry neither."
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Import Harris County ${{ inputs.plan_year }} plans from the CMS PUFs" \
            --body "$(cat <<'BODY'
          Generated by the **Import real Texas plans** workflow.

          - Plans, premiums, deductibles, out-of-pocket maximums and every document
            URL are copied from the CMS Exchange Public Use Files. Nothing is invented.
          - `data/plans/harris-2026.provenance.json` records the source files, their
            SHA-256 checksums, row counts and the selection rule.
          - Every Summary of Benefits and Coverage, formulary and provider-directory
            URL was fetched by `scripts/check-links.ts` in this run.
          - Networks and formularies are still simulated: the PUFs carry neither.

          Please check the selected plans look sensible before merging.
          BODY
          )" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH"
