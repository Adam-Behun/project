<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crosswalk: ICHRA decision support for employers and employees</title>
<meta name="description" content="Employers model which employee classes to move to an ICHRA and what allowance to set. Employees pick the individual plan with the lowest expected total cost of care, from their own FHIR records. Synthetic data only.">
<!-- Fonts are served from this origin: an app that argues about health-data
     privacy should not leak a request to a font CDN on every page view. -->
<link rel="stylesheet" href="fonts.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1" y="1" width="24" height="24" rx="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M6 17 L11 12 L15 15 L20 8" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Crosswalk
  </div>
  <nav class="toggle" id="viewToggle" aria-label="Choose a view">
    <button type="button" data-view="employer">Employer</button>
    <button type="button" data-view="employee">Employee</button>
  </nav>
</div></header>

<main class="wrap">
  <section class="lede-bar">
    <h1 id="shellTitle"></h1>
    <p id="shellLede"></p>
    <span class="privacy" id="shellPrivacy" hidden></span>
  </section>
  <div id="view" aria-live="polite">
    <div class="loading"><p>Loading&hellip;</p></div>
  </div>
</main>

<footer><div class="wrap">
  <p><strong>Crosswalk</strong> is a hackathon demo built on synthetic data. Synthetic patients generated with Synthea; a synthetic employer and synthetic claims.</p>
  <p>Not insurance, legal, tax, or actuarial advice. <a href="https://github.com/Adam-Behun/Crosswalk">Source and method on GitHub</a>.</p>
</div></footer>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
